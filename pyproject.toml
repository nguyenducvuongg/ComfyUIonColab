[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "comfycolab"
version = "2.1.0"
description = "Optimized ComfyUI engine and SSH-Tailscale tunnel toolkit for Google Colab"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
dependencies = []

[project.scripts]
comfycolab = "comfycolab.cli:main"

[tool.setuptools.packages.find]
include = ["comfycolab*", "scripts*"]
